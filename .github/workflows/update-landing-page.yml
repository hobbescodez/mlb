name: Update Landing Page

# Manual-only. The landing page is static except for the shared font
# cache, so it doesn't need a daily schedule - re-run this whenever the
# sport roster or box states change (e.g. flipping NFL from "Coming soon"
# to live once it ships).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build landing page
        run: python build_landing_page.py

      - name: Commit and push
        run: |
          git config user.name "epl-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update landing page"
            # same non-fast-forward race the daily sport workflows can hit
            # (see daily-report.yml/daily-epl-report.yml) - rebase before
            # pushing rather than failing the run over it.
            git pull --rebase origin main
            git push
          fi
