name: Probe EPL Sources

# One-off / manual reconnaissance workflow, same pattern as probe-sources.yml
# (MLB). Run manually (workflow_dispatch) to dump the raw structure of each
# EPL data source into the job log so real fetchers can be designed against
# actual field names, since the dev sandbox used to build this repo cannot
# reach these hosts directly.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Probe EPL sources
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/probe_epl_sources.py
