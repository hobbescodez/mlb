name: Daily EPL Analysis

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python main_epl.py

      - name: Commit and push report
        run: |
          git config user.name "epl-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/epl.html docs/epl-*.html docs/epl_artifact_fragment.html
          if [ -f sports/epl/report/inline_fonts.cache.css ]; then
            git add sports/epl/report/inline_fonts.cache.css
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily EPL analysis: $(date -u +%Y-%m-%d)"
            git push
          fi
