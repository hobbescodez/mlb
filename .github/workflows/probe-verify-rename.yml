name: Probe Verify Rename
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check new Pages URL
        run: |
          echo "--- new URL (hobbescodez.github.io/mlb/) ---"
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://hobbescodez.github.io/mlb/")
          echo "HTTP status: $code"
          curl -sS "https://hobbescodez.github.io/mlb/" -o new.html
          echo "lines: $(wc -l < new.html)"
          grep -o "<title>[^<]*</title>" new.html | head -1
          echo "--- old URL (meganfinnrigney-eng.github.io/mlb/) - expect redirect or 404 ---"
          code_old=$(curl -sS -o /dev/null -w "%{http_code}" -L "https://meganfinnrigney-eng.github.io/mlb/")
          echo "HTTP status (following redirects): $code_old"
          curl -sS -I "https://meganfinnrigney-eng.github.io/mlb/" | head -5
