name: Probe Verify Accuracy
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live index and grep for new sections
        run: |
          curl -sS "https://meganfinnrigney-eng.github.io/mlb/" -o live.html
          echo "--- top-pick badge/row count ---"
          grep -c "top-pick-badge\|top-pick-row" live.html || true
          echo "--- Accuracy — All Games ---"
          grep -o "Accuracy .. All Games" live.html | head -1 || true
          echo "--- What Predicts Accuracy ---"
          grep -o "What Predicts Accuracy" live.html | head -1 || true
          echo "--- not enough data banner ---"
          grep -o "not enough data yet[^<]*" live.html | head -1 || true
          echo "--- days logged mention ---"
          grep -oE "Only [0-9]+ day\(s\) of scored games" live.html | head -1 || true
          echo "--- ML/Totals badge text near top pick ---"
          grep -o "🏆 ML\|↕ Totals" live.html | sort | uniq -c || true
          echo "--- accuracy table source rows ---"
          grep -oE "<td[^>]*>(DRatings|BPP|My model)</td>" live.html | head -10 || true
